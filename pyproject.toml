# TAP dcom plugin — package-mode distribution.
# Identity chain (the pre-boot conformance gate enforces agreement, req-tap-plugin-arch-identity):
#   slug "dcom" == dist "dcom-tap" == namespace "tap_plugin.dcom" == entry-point key "dcom".
# A vocabulary plugin: four `dimension` nodes and the rules for stamping the `dcom` label.
# No models, no edges, no pages, no collector, no credential, no network.
# Spec: specs/spec-dcom-v0.md.
[project]
name = "dcom-tap"
description = "TAP dcom plugin — the design / configuration / operation axis as a dimension pack."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
dcom = "tap_plugin.dcom.apps:DcomConfig"

# The plugin's OWN dev closure (PEP 735), so its suite runs in a bare checkout.
# Never installed by boot.
[dependency-groups]
dev = ["pytest>=8.3", "pytest-django>=4.9"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/dcom"]
