manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.2.0"
slug = "dcom"
name = "TAP dcom"
description = "The design / configuration / operation axis as a dimension pack: four dimension nodes and the rules for stamping the `dcom` label on nodes and edges. Vocabulary substrate — no models, no edges, no pages, no collector, no credential, no network. Consumers inherit the axis by declaring `dcom` in depends_on."

# No depends_on: core's `dimension` model is the only type this plugin writes
# (spec-dcom-v0.md, Plugin Identity). Every dependency direction is INTO this plugin.

# Pure vocabulary — no code beyond an AppConfig, no dependencies, no native
# binaries, no crypto (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

# The dimension pack (req-dcom-pack): four `dimension` nodes, no edges.
[grift]
dimensions = "grift/dimensions.grift.json"

# In-package boot record (req-boot-bootstrap-records-in-package). The digest is the
# canonical sha256 of the record (sorted keys, tight separators) — regenerate with
# scripts/boot-record-hash --refresh in a core checkout; never hand-edit.
[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure (empty) + self, offline, credential-free. The consumer flips self to editable."
